<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты | Мой Проект</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <a href="index.html">Главная</a>
            <a href="contacts.html" class="active">Контакты</a>
        </nav>
    </header>

    <main class="container">
        <section class="contacts-section">
            <h1>Свяжитесь со мной</h1>
            <p>Можете написать мне что-нибудь хорошее. Нехорошее не пишите.</p>

            <div class="contact-info">
                <h3>Мои контакты:</h3>
                <p><strong>Город:</strong> Воронеж, Россия</p>
                <p><strong>Email:</strong> nikitasl22256@gmail.com</p>
                <p><strong>Telegram:</strong> @microchelicc</p>
            </div>

            <div class="contact-form-wrapper">
                <h3>Напишите мне</h3>
                <form id="feedback-form" novalidate>
                    <div class="form-group">
                        <label for="name">Ваше имя:</label>
                        <input type="text" id="name" name="name" placeholder="Как к вам обращаться?">
                    </div>

                    <div class="form-group">
                        <label for="email">Ваш Email:</label>
                        <input type="email" id="email" name="email" placeholder="example@mail.ru">
                    </div>

                    <div class="form-group">
                        <label for="message">Сообщение:</label>
                        <textarea id="message" name="message" rows="5" placeholder="Ваш текст..."></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Отправить сообщение</button>
                </form>
                <div id="form-message"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Мой Проект. Все права защищены.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('feedback-form');
            const messageBox = document.getElementById('form-message');

            form.addEventListener('submit', function(event) {
                event.preventDefault();
                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const message = document.getElementById('message').value.trim();
                messageBox.innerHTML = '';
                messageBox.className = '';

                if (!name || !email || !message) {
                    messageBox.textContent = 'Ошибка: Все поля должны быть заполнены!';
                    messageBox.className = 'error-message';
                    return;
                }

                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    messageBox.textContent = 'Ошибка: Введите корректный email адрес!';
                    messageBox.className = 'error-message';
                    return;
                }

                messageBox.innerHTML = `
                    <p class="success-text">
                        Спасибо, <strong>${escapeHtml(name)}</strong>! 
                        Ваше сообщение отправлено с email: <em>${escapeHtml(email)}</em>
                    </p>
                    <p class="success-preview">Текст сообщения: "${escapeHtml(message)}"</p>
                `;
                messageBox.className = 'success-message';

                form.reset();
            });

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        });
    </script>
</body>
</html>
